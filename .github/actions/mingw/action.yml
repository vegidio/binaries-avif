name: "mingw"

# Pinned upstream versions — bump these to upgrade.
# vcpkg commit: f7892cd41e6c (master — adds libavif svt feature, 2026-07-14)
# libavif: built by vcpkg (port version 1.4.2), no longer cloned

inputs:
  arch:
    description: "Target architecture suffix (e.g. x64, arm64)"
    required: true
  msystem:
    description: "MSYS2 environment (e.g. MINGW64, CLANGARM64)"
    required: true
  packages:
    description: "MSYS2 packages to install (newline-separated)"
    required: true
  triplet-prefix:
    description: "vcpkg triplet prefix (e.g. x64-mingw); -static and -dynamic are derived from it"
    required: true

runs:
  using: composite
  steps:
    - name: Install NASM
      uses: ilammy/setup-nasm@v1

    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ inputs.msystem }}
        update: true
        install: ${{ inputs.packages }}

    - name: Cache vcpkg binaries
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-${{ runner.os }}-${{ inputs.triplet-prefix }}-f7892cd

    - name: Install vcpkg
      shell: bash
      run: |
        mkdir -p $GITHUB_WORKSPACE/static_${{ inputs.arch }}/lib
        mkdir -p $GITHUB_WORKSPACE/dynamic_${{ inputs.arch }}/lib
        mkdir -p $GITHUB_WORKSPACE/vcpkg_cache
        git -c init.defaultBranch=main init builder
        git -C builder remote add origin https://github.com/microsoft/vcpkg
        git -C builder fetch --depth 1 origin f7892cd41e6cc68fc864df119dc03b9d2b1ce9d5
        git -C builder checkout FETCH_HEAD
        ./builder/bootstrap-vcpkg.sh

    - name: Build libavif
      shell: msys2 {0}
      env:
        MSYS2_PATH_TYPE: inherit
        VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
      run: |
        ./builder/vcpkg install "libavif[core,dav1d,svt]:${{ inputs.triplet-prefix }}-static"
        ./builder/vcpkg install "libavif[core,dav1d,svt]:${{ inputs.triplet-prefix }}-dynamic"

    - name: Stage libraries
      shell: bash
      run: |
        cp -r $GITHUB_WORKSPACE/builder/installed/${{ inputs.triplet-prefix }}-static/include $GITHUB_WORKSPACE/static_${{ inputs.arch }}/
        for file in "$GITHUB_WORKSPACE"/builder/installed/${{ inputs.triplet-prefix }}-static/lib/*.a; do
          cp "$file" "$GITHUB_WORKSPACE/static_${{ inputs.arch }}/lib/"
        done

        cp -r $GITHUB_WORKSPACE/builder/installed/${{ inputs.triplet-prefix }}-dynamic/include $GITHUB_WORKSPACE/dynamic_${{ inputs.arch }}/
        # DLLs only (no *.dll.a import libs), matching the previous dynamic artifact.
        for file in "$GITHUB_WORKSPACE"/builder/installed/${{ inputs.triplet-prefix }}-dynamic/bin/*.dll; do
          cp "$file" "$GITHUB_WORKSPACE/dynamic_${{ inputs.arch }}/lib/"
        done

    - name: Strip debug info
      shell: msys2 {0}
      run: |
        # Strip DWARF debug info from the static .a files (it's the bulk of their
        # size and is not needed to link against them). Run under MSYS2 so the
        # toolchain strip matches the target (GNU strip on MINGW64, llvm-strip on
        # CLANGARM64); --strip-debug keeps the symbol table, so the libs still link.
        strip --strip-debug "$GITHUB_WORKSPACE"/static_${{ inputs.arch }}/lib/*.a

    - name: Zip local
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE/static_${{ inputs.arch }}
        7z a -tzip -mx=9 -snl $GITHUB_WORKSPACE/static_mingw_${{ inputs.arch }}.zip include lib

        cd $GITHUB_WORKSPACE/dynamic_${{ inputs.arch }}
        7z a -tzip -mx=9 -snl $GITHUB_WORKSPACE/dynamic_mingw_${{ inputs.arch }}.zip include lib

    - name: Install bundle tools
      shell: msys2 {0}
      run: |
        # mingw-w64-x86_64-llvm on MINGW64, mingw-w64-clang-aarch64-llvm on CLANGARM64.
        pacman -S --noconfirm --needed "${MINGW_PACKAGE_PREFIX}-llvm"

    - name: Create bundle
      shell: msys2 {0}
      run: |
        # Run under msys2 so the link tests use the environment's own toolchain and runtime (as in the strip step).
        bash scripts/bundle.sh --os mingw --arch ${{ inputs.arch }} \
          --static-dir "$GITHUB_WORKSPACE/static_${{ inputs.arch }}" \
          --output "$GITHUB_WORKSPACE/bundle_mingw_${{ inputs.arch }}.zip"

    - name: Save artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-mingw-${{ inputs.arch }}
        path: "*.zip"
